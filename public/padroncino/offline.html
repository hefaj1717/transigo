<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B3B8C">
  <title>Sei offline – Transigo Partner</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, sans-serif; background: #fff; color: #18181b; padding: 24px; box-sizing: border-box; }
    main { max-width: 22rem; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 1.5rem; margin: 1.25rem 0 .5rem; }
    p { color: #52525b; line-height: 1.5; margin: 0 0 1.5rem; }
    button { width: 100%; min-height: 3.25rem; border: 0; border-radius: .75rem; background: #0B3B8C; color: #fff;
             font-size: 1.05rem; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/padroncino/icons/icon-192.png" alt="">
    <h1>Sei offline</h1>
    <p>Controlla la connessione a internet e riprova. Le tue corse e i tuoi dati non vengono salvati sul telefono.</p>
    <button type="button" onclick="location.reload()">Riprova</button>
  </main>
</body>
</html>
